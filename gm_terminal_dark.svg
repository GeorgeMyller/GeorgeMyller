.dim { fill: #8b949e; }
.white { fill: #e6edf3; }
.link { fill: #58a6ff; font-weight: bold; }
.online { fill: #3fb950; font-weight: bold; }
.pause { fill: #e3b341; font-weight: bold; }
.bar-py { fill: #7ee787; font-weight: bold; }
.bar-ts { fill: #79c0ff; font-weight: bold; }
.bar-db { fill: #d2a8ff; font-weight: bold; }
</style>
