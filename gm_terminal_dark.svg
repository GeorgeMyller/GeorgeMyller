}
@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}
.cursor { animation: blink 1.1s infinite; }
.pulse-live { animation: pulse 2s infinite ease-in-out; }
a { text-decoration: none; cursor: pointer; }
