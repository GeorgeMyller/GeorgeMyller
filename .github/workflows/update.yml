name: Update Profile Stats

on:
  schedule:
    - cron: '0 4 * * *'  # Roda diariamente às 04:00 UTC
  workflow_dispatch:     # Permite execução manual a qualquer momento
  push:
    branches:
      - main
    paths:
      - update_stats.py
      - pyproject.toml

concurrency:
  group: profile-stats
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Run Stats Generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --with requests python update_stats.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gm_terminal_dark.svg gm_terminal_light.svg
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos SVGs. Tudo atualizado."
          else
            git commit -m "chore(stats): auto-update terminal stats [skip ci]"
            git pull --rebase -X ours origin main
            git push origin main
          fi
