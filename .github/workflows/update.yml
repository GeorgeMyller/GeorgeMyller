name: Update Profile Stats

on:
  schedule:
    - cron: '0 4 * * *'  # Roda diariamente às 04:00 UTC
  workflow_dispatch:     # Permite execução manual a qualquer momento
  push:
    branches:
      - main
    paths:
      - update_stats.py
      - avatar.jpg

# Evita conflitos de pushes concorrentes
concurrency:
  group: profile-stats
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stats Generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python update_stats.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add terminal_dark.svg terminal_light.svg
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos SVGs. Tudo atualizado."
          else
            git commit -m "chore(stats): auto-update terminal stats [skip ci]"
            git pull --rebase -X ours origin main
            git push origin main
          fi
